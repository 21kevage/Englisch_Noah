function question(){focusMode(true);hideToast();if(typeof window!=='undefined'&&window.scrollTo)window.scrollTo(0,0);if(session.index>=session.queue.length){focusMode(false);const r=session.results;const okN=r.filter(x=>x.ok).length,q=r.length?okN/r.length:0,stars=q>=.9?3:q>=.6?2:1;$('#screen').innerHTML=`<div class="card done pop"><div class="emoji">${stars===3?'🏆':stars===2?'🎉':'💪'}</div><h2>${stars===3?'Mega, Runde geschafft!':stars===2?'Gut gemacht!':'Geschafft, weiter so!'}</h2><div class="stars" aria-label="${stars} von 3 Sternen">${'⭐'.repeat(stars)}${'<span style="opacity:.25">⭐</span>'.repeat(3-stars)}</div><p>${okN} von ${r.length} Versuchen richtig.</p><p class="muted" style="font-size:14px">Ein Wort ist „sicher“, wenn du es an drei verschiedenen Tagen richtig hattest.</p><div class="stack"><button class="primary" id="again">Noch eine Runde 🚀</button><button id="back">🏠 Zur Übersicht</button><button class="ghost" id="back1">‹ Letzte Aufgabe nochmal</button></div></div>`;if(stars>=2)confetti();const m=session.mode;$('#again').onclick=()=>start(m);$('#back1').onclick=goBack;$('#back').onclick=()=>{session=null;home();};return;}
 session.snaps=session.snaps||[];if(!session.snaps[session.index])session.snaps[session.index]={p:JSON.stringify(db.entries.map(x=>[x.id,x.progress])),r:session.results.length,q:session.queue.length,t:[...session.retried]};
 let e=current(),v=e.approved,m=session.mode,typing=m!=='spell';session.done=false;session.revealed=false;const total=session.queue.length,pos=session.index+1;
 const label=m==='sentence'?'💬 Übersetze wie im Buch':m==='word'?'🔤 Wie heißt das auf Englisch?':'🐝 Buchstabiere auf Englisch';
 $('#screen').innerHTML=`<div class="session-bar"><button class="ghost" id="back1" ${session.index?'':'disabled'} aria-label="Vorherige Aufgabe">‹ Zurück</button><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${pos-1}"><i style="width:${Math.round((pos-1)/total*100)}%"></i></div><span class="count">${pos} / ${total}</span><button class="ghost home" id="quit" aria-label="Zur Startseite">🏠</button></div>
 <div class="card"><div class="task">${label}</div><p class="question">${esc(m==='sentence'?v.translation:m==='word'?v.de:v.en)}</p><button class="ghost" id="promptAudio">🔊 Anhören</button>
 ${typing?`<label for="answer" style="margin-top:14px">Tippe deine Antwort oder sag sie laut</label><textarea id="answer" rows="1" lang="en" enterkeyhint="done" autocapitalize="${m==='sentence'?'sentences':'none'}" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>`:''}
 <div class="stack" id="actions">${typing?'<button class="primary" id="check" disabled>Prüfen</button>':''}<button id="reveal">${m==='spell'?'🗣️ Laut buchstabiert, zeig die Lösung':'🗣️ Laut gesagt, zeig die Lösung'}</button></div>
 <div id="feedback" aria-live="polite"></div><button class="primary" id="next" hidden style="width:100%;margin-top:14px">${pos<total?'Weiter ➜':'Fertig 🎉'}</button></div>
 ${typing?'<p class="muted" style="font-size:14px">Tipp: Beim Tippen zählt auch die Großschreibung. Wenn du laut antwortest, entscheidest du selbst, ob es richtig war.</p>':''}`;
 $('#quit').onclick=()=>{session=null;home();};$('#back1').onclick=goBack;$('#promptAudio').onclick=()=>speak(m==='spell'?v.en:m==='sentence'?v.translation:v.de,m==='spell'?'en-GB':'de-DE');
 const a=$('#answer');if(a){a.oninput=()=>{grow(a);$('#check').disabled=!a.value.trim();};a.onkeydown=ev=>{if(ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault();ev.stopPropagation();if(!session.done)check();}};$('#check').onclick=check;if(session.typed)a.focus();}
 $('#reveal').onclick=reveal;$('#next').onclick=()=>{session.index++;question();};}
function goBack(){if(!session||!session.index||!session.snaps)return;const i=session.index-1,sn=session.snaps[i];if(!sn)return;const map=new Map(JSON.parse(sn.p));db.entries.forEach(x=>{if(map.has(x.id))x.progress=map.get(x.id);});session.results.length=sn.r;session.queue.length=sn.q;session.retried=new Set(sn.t);session.snaps.length=i;session.index=i;save();question();toast('Zurück zur vorherigen Aufgabe. Die alte Antwort zählt nicht mehr.');}
function afterAnswer(){const a=$('#answer');if(a&&a.blur){a.blur();a.readOnly=true;}const act=$('#actions');if(act)act.hidden=true;const n=$('#next');if(n&&n.scrollIntoView){n.scrollIntoView({block:'nearest',behavior:'smooth'});}}
function norm(s){return s.normalize('NFC').replace(/[‘’]/g,"'").replace(/\s*(?:\.\.\.|…)\s*/g,' … ').replace(/\s+/g,' ').trim().replace(/[.!?]+$/,'');}
function target(){const v=current().approved;return session.mode==='sentence'?v.sentence:v.en;}
function difference(a,b){const aa=norm(a).split(' '),bb=norm(b).split(' ');let d=Array.from({length:aa.length+1},()=>Array(bb.length+1).fill(0));for(let i=aa.length;i>=0;i--)for(let j=bb.length;j>=0;j--){if(i===aa.length)d[i][j]=bb.length-j;else if(j===bb.length)d[i][j]=aa.length-i;else d[i][j]=aa[i]===bb[j]?d[i+1][j+1]:1+Math.min(d[i+1][j],d[i][j+1],d[i+1][j+1]);}let i=0,j=0,out=[];while(i<aa.length||j<bb.length){if(i<aa.length&&j<bb.length&&aa[i]===bb[j]){out.push(esc(bb[j]));i++;j++;}else if(i<aa.length&&j<bb.length&&d[i][j]===1+d[i+1][j+1]){out.push(`<mark>${esc(aa[i])} → ${esc(bb[j])}</mark>`);i++;j++;}else if(j<bb.length&&d[i][j]===1+d[i][j+1]){out.push(`<mark>+ ${esc(bb[j++])}</mark>`);}else{out.push(`<mark>− ${esc(aa[i++])}</mark>`);}}return out.join(' ');}
function check(){if(session.done)return;const a=$('#answer').value;if(!a.trim())return;session.typed=true;const ok=norm(a)===norm(target());record(ok,'Textvergleich');$('#feedback').innerHTML=`<div class="result ${ok?'ok':'bad'} pop"><h3>${ok?'🎉 '+pick(PRAISE):'💡 Fast! Schau mal:'}</h3>${ok?'':`<p>${difference(a,target())}</p>`}<p><b>Im Buch:</b> ${esc(target())}</p><button class="ghost" id="audio">🔊 Anhören</button></div>`;$('#audio').onclick=()=>speak(target(),'en-GB');afterAnswer();}
function reveal(){if(session.done)return;session.revealed=true;session.typed=false;const a=$('#answer');if(a&&a.blur){a.blur();if(!a.value.trim()&&a.parentNode){a.hidden=true;const lb=$('label[for=answer]');if(lb)lb.hidden=true;}}$('#actions').hidden=true;const t=target(),m=session.mode;$('#feedback').innerHTML=`<div class="result ok pop" style="background:#f4fbf8"><p style="margin-top:0"><b>Lösung:</b> ${esc(m==='spell'?t.split('').join(' · '):t)}</p><button class="ghost" id="audio">🔊 ${m==='spell'?'Buchstaben anhören':'Anhören'}</button></div><p style="margin-bottom:0;font-weight:700">Hattest du es richtig?</p><div class="pair" id="selfEval"><button class="yes" id="yes">👍 Ja!</button><button class="no" id="no">🔁 Noch üben</button></div>`;$('#audio').onclick=()=>speak(m==='spell'?t.replace(/[^a-z]/gi,'').split('').join(', '):t,'en-GB');$('#yes').onclick=()=>finishSelf(true);$('#no').onclick=()=>finishSelf(false);const s=$('#selfEval');if(s.scrollIntoView)s.scrollIntoView({block:'nearest',behavior:'smooth'});}
function finishSelf(ok){record(ok,'Selbstbewertung');$('#selfEval').hidden=true;$('#feedback').innerHTML+=`<p class="${ok?'success':'muted'}" style="font-weight:700">${ok?'🎉 '+pick(PRAISE):'Kein Problem, das kommt gleich nochmal.'}</p>`;afterAnswer();}
function record(ok,source){if(session.done)return;session.done=true;const e=current(),m=session.mode,now=Date.now(),day=new Date().toLocaleDateString('en-CA');let p=e.progress[m]||{attempts:0,days:[],due:0,source,lastOK:false};p.attempts++;p.lastOK=ok;p.source=source;const repeated=session.retried.has(e.id);if(ok&&!repeated&&!p.days.includes(day))p.days.push(day);if(!ok)p.days=[];p.due=ok?dayStart(repeated?1:Math.min(14,[1,3,7,14][Math.min(p.days.length-1,3)]||1)):now;e.progress[m]=p;session.results.push({id:e.id,ok,source});if(!ok&&!repeated){session.retried.add(e.id);session.queue.push(e.id);}save();$('#next').hidden=false;$('#reveal').disabled=true;if($('#check'))$('#check').disabled=true;}
function speak(text,lang){if(!('speechSynthesis'in window)){toast('Vorlesen ist hier nicht verfügbar.');return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.85;u.onerror=ev=>{if(ev&&ev.error==='interrupted'||ev&&ev.error==='canceled')return;toast('Vorlesen fehlgeschlagen. Bitte auf dem iPhone die Systemstimmen prüfen.');};speechSynthesis.speak(u);}
function status(p){return !p?'Noch offen':!p.lastOK?'Noch üben':p.days.length>=3?'Sicher':'Im Aufbau';}
function progress(){const es=db.entries.filter(e=>e.approved),all=es.flatMap(e=>['word','sentence','spell'].filter(m=>m!=='sentence'||e.approved.sentence).map(m=>status(e.progress[m]))),cnt=k=>all.filter(x=>x===k).length,cls={'Sicher':'c-sure','Im Aufbau':'c-grow','Noch üben':'c-practice','Noch offen':'c-open'},ico={'Sicher':'⭐','Im Aufbau':'🌱','Noch üben':'🔁','Noch offen':'⚪'},lab={word:'Wort',sentence:'Satz',spell:'Buchst.'};
 $('#screen').innerHTML=`<h2>Dein Lernstand 🏆</h2><div class="summary"><div><b>⭐ ${cnt('Sicher')}</b>sicher</div><div><b>🌱 ${cnt('Im Aufbau')}</b>im Aufbau</div><div><b>🔁 ${cnt('Noch üben')}</b>noch üben</div></div><p class="muted" style="font-size:14px">Wort, Satz und Buchstabieren zählen einzeln. Richtig an drei verschiedenen Tagen heißt „sicher“.</p>${es.length?es.map(e=>`<div class="card" style="padding:14px 16px"><div class="prog"><h3>${esc(e.approved.en)}</h3><small>${esc(e.approved.de)}</small></div><div class="chips">${['word','sentence','spell'].filter(m=>m!=='sentence'||e.approved.sentence).map(m=>{const st=status(e.progress[m]);return `<span class="chip ${cls[st]}">${ico[st]} ${lab[m]}: ${st}</span>`;}).join('')}</div></div>`).join(''):'<div class="card"><p>Noch keine freigegebenen Wörter.</p></div>'}`;}
function book(){$('#screen').innerHTML=`<h2>Vokabelbuch 📚</h2><input id="search" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" aria-label="Vokabeln durchsuchen" placeholder="Wort, Abschnitt oder Seite suchen"><button class="primary" id="add" style="width:100%">➕ Neuen Eintrag erfassen</button><div id="list"></div>`;$('#add').onclick=()=>edit(null,false);$('#search').oninput=list;$('#search').onkeydown=ev=>{if(ev.key==='Enter')ev.target.blur();};list();}
function list(){const q=$('#search').value.toLowerCase();$('#list').innerHTML=db.entries.filter(e=>Object.values(e.approved||e.pending).join(' ').toLowerCase().includes(q)).map(e=>{const v=e.approved||e.pending;return `<div class="card"><span class="tag${e.pending?' wait':''}">${e.pending?'⏳ Prüfung offen':'✅ Freigegeben'}</span><small> ${esc(v.section)} · S. ${esc(v.page)}</small><h3>${esc(v.en)} <span class="muted">· ${esc(v.de)}</span></h3>${v.sentence?`<p>${esc(v.sentence)}<br><small>${esc(v.translation)}</small></p>`:''}${v.note?`<p>${esc(v.note)}</p>`:''}${v.also?`<small>Auch: ${esc(v.also)}</small><br>`:''}<button data-edit="${esc(e.id)}">Bearbeiten</button>${e.pending&&e.approved?'<p class="muted">Änderung wartet auf Prüfung; angezeigt wird die freigegebene Fassung.</p>':''}</div>`;}).join('');$('#list').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit,false));}
const FIELDS=[['unit','Unit','input',{required:1}],['section','Abschnitt','input',{required:1}],['page','Seite','input',{inputmode:'numeric'}],['en','Englisch','input',{required:1,lang:'en',autocapitalize:'none'}],['de','Deutsch (mehrere Bedeutungen mit Semikolon)','input',{required:1}],['sentence','Englischer Buchsatz','textarea',{lang:'en',autocapitalize:'sentences'}],['translation','Deutsche Satzübersetzung','textarea',{autocapitalize:'sentences'}],['note','Buchhinweis','textarea',{free:1}],['also','Weitere Zuordnung','input',{}]];
function field([k,l,type,o],v){const attrs=`id="f-${k}" name="${k}" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="${o.free?'enter':'next'}"${o.required?' required':''}${o.lang?` lang="${o.lang}"`:''}${o.autocapitalize?` autocapitalize="${o.autocapitalize}"`:''}${o.inputmode?` inputmode="${o.inputmode}"`:''}`;return `<div><label for="f-${k}">${l}</label>${type==='input'?`<input ${attrs} value="${esc(v[k])}">`:`<textarea rows="2" ${attrs}>${esc(v[k])}</textarea>`}</div>`;}
function edit(id,parent){const e=db.entries.find(e=>e.id===id),v=e?(e.pending||e.approved):{unit:'Unit 1',section:'',page:'',en:'',de:'',sentence:'',translation:'',note:'',also:''};const f=Object.fromEntries(FIELDS.map(x=>[x[0],field(x,v)]));
 $('#screen').innerHTML=`<h2>${parent?'Eintrag prüfen':e?'Eintrag bearbeiten':'Eintrag erfassen'}</h2><p class="muted">Nur vorhandene Buchsätze übernehmen. Deutsche Satzübersetzung gegenprüfen.</p><form class="card" id="editor" novalidate><div class="grid3">${f.unit}${f.section}${f.page}</div>${f.en}${f.de}${f.sentence}${f.translation}<details${v.note||v.also?' open':''}><summary>Hinweis und weitere Zuordnung</summary>${f.note}${f.also}</details><div class="form-actions"><button class="primary">${parent?'Freigeben':'Zur Prüfung abgeben'}</button><button type="button" id="cancel">Zurück</button></div></form>${e?`<button type="button" class="ghost danger" id="del">${e.pending&&e.approved?'↩️ Änderung verwerfen':'🗑️ Eintrag löschen'}</button>`:''}`;
 const form=$('#editor'),inputs=[...form.querySelectorAll('input,textarea')];inputs.forEach((el,i)=>{if(el.tagName==='TEXTAREA'){grow(el);el.addEventListener('input',()=>grow(el));}el.addEventListener('keydown',ev=>{if(ev.key!=='Enter'||ev.isComposing||el.name==='note')return;ev.preventDefault();const nx=inputs.slice(i+1).find(x=>x.offsetParent!==null);nx?nx.focus():el.blur();});});
 $('#cancel').onclick=render;if($('#del'))$('#del').onclick=()=>{if(e.pending&&e.approved){e.pending=null;save();toast('Änderung verworfen.');render();return;}if(!confirm(`„${(e.approved||e.pending).en}“ mit Lernstand löschen?`))return;db.entries=db.entries.filter(x=>x!==e);save();toast('Eintrag gelöscht.');render();};form.onsubmit=ev=>{ev.preventDefault();const data=Object.fromEntries(new FormData(form));for(const k in data)data[k]=data[k].trim();const missing=FIELDS.find(([k,,,o])=>o.required&&!data[k]);if(missing){toast(`Bitte „${missing[1].split(' (')[0]}“ ausfüllen.`);$('#f-'+missing[0]).focus();return;}if(!!data.sentence!==!!data.translation){toast('Bitte beide Satzfelder ausfüllen oder beide leer lassen.');$(data.sentence?'#f-translation':'#f-sentence').focus();return;}let entry=e||{id:'own-'+Date.now()+'-'+Math.random().toString(36).slice(2),approved:null,pending:null,progress:{}};data.id=entry.id;if(parent&&unlocked){if(JSON.stringify(entry.approved)!==JSON.stringify(data))entry.progress={};entry.approved=data;entry.pending=null;}else entry.pending=data;if(!e)db.entries.push(entry);save();toast(parent?'Freigegeben.':'Zur Prüfung abgegeben.');render();};}
function parents(){unlocked=true;
$('#screen').innerHTML=`<h2>Prüfung & Sicherung</h2><p>${db.entries.filter(e=>e.pending).length} Einträge warten auf Freigabe. Englische Buchsätze und ergänzte deutsche Übersetzungen bitte einzeln prüfen. Lautschrift ist in diesem Prototyp noch nicht übertragen.</p><div class="card"><div class="files"><label class="filebtn f-import"><span class="fi" aria-hidden="true">📥</span><span>Vokabeldatei importieren<small>Fügt nur neue Einträge hinzu</small></span><input class="vh" id="vocabImport" type="file" accept="application/json,.json"></label><button type="button" class="filebtn f-export" id="export"><span class="fi" aria-hidden="true">💾</span><span>Sicherung exportieren<small>Alle Einträge und Lernstände als Datei</small></span></button><label class="filebtn f-restore"><span class="fi" aria-hidden="true">🔄</span><span>Sicherung wiederherstellen<small>Ersetzt den aktuellen Stand</small></span><input class="vh" id="import" type="file" accept="application/json,.json"></label></div>${rescueKeys().length?`<p class="notice" style="margin-top:15px">Es liegen ${rescueKeys().length} beiseitegelegte Datenstände vor, die beim Start nicht lesbar waren.</p><button id="rescue">Beiseitegelegte Daten herunterladen</button>`:''}</div>${db.entries.filter(e=>e.pending).map(e=>`<div class="card"><small>${esc(e.pending.section)} · S. ${esc(e.pending.page)}</small><h3>${esc(e.pending.en)}</h3><p>${esc(e.pending.de)}</p><p>${esc(e.pending.sentence)}<br>${esc(e.pending.translation)}</p><button data-review="${esc(e.id)}" style="width:100%">Prüfen und freigeben</button></div>`).join('')}`;$('#vocabImport').onchange=importVocab;$('#export').onclick=backup;$('#import').onchange=restore;if($('#rescue'))$('#rescue').onclick=downloadRescue;$('#screen').querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>edit(b.dataset.review,true));}
function backup(){return deliver(JSON.stringify(db,null,2),'Noah-Englisch-Sicherung-'+new Date().toISOString().slice(0,10)+'.json');}
async function deliver(text,name){
 // iOS-Home-Bildschirm-Apps ignorieren Download-Links oft; das Teilen-Menü bietet "In Dateien sichern".
 try{if(typeof File!=='undefined'&&navigator.canShare){const file=new File([text],name,{type:'application/json'});if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return;}}}
 catch(e){if(e&&e.name==='AbortError')return;}
 const blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function downloadRescue(){for(const k of rescueKeys()){const raw=localStorage.getItem(k);if(raw)deliver(raw,'Noah-Englisch-Rohdaten-'+k.slice(RESCUE.length)+'.json');}}
async function restore(ev){const f=ev.target.files[0];if(!f)return;ev.target.value='';try{if(f.size>10*1024*1024)throw Error('Datei zu groß');const next=validate(JSON.parse(await f.text()));if(!confirm('Aktuelle Einträge und Lernstände vollständig durch diese Sicherung ersetzen? Vorher gegebenenfalls exportieren.'))return;db=next;session=null;unlocked=false;rescuedNow=false;save();render();toast('Sicherung wiederhergestellt.');}catch(e){toast('Sicherung nicht eingelesen: '+e.message);}}

function vocabularyPack(x){
 if(!x||x.type!=='noah-vocabulary'||x.version!==1||!Array.isArray(x.entries)||x.entries.length>5000)throw Error('Keine passende Vokabeldatei');
 const entries=x.entries.map(v=>({id:v.id,approved:null,pending:v,progress:{}}));
 validate({version:1,pin:'',entries});
 return entries;
}
async function importVocab(ev){
 const f=ev.target.files[0];if(!f)return;
 try{if(f.size>10*1024*1024)throw Error('Datei zu groß');
 const entries=vocabularyPack(JSON.parse(await f.text()));
 const known=new Set(db.entries.map(e=>e.id));const added=entries.filter(e=>!known.has(e.id));
 if(db.entries.length+added.length>5000)throw Error('Zu viele Einträge');
 db.entries.push(...added);save();parents();toast(added.length+' neue Einträge zur Prüfung aufgenommen. '+(entries.length-added.length)+' vorhandene Einträge unverändert.');
 }catch(e){toast('Import nicht ausgeführt: '+e.message);}
}
if(typeof navigator!=='undefined'&&'serviceWorker' in navigator&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))){

 $('#offline').textContent='App für Offline-Nutzung gespeichert. Vorlesen hängt von den verfügbaren Systemstimmen ab.';
 }).catch(()=>{$('#offline').textContent='Offline-Speicherung fehlgeschlagen. Bitte online erneut öffnen.';});
}else if(typeof navigator!=='undefined'){$('#offline').textContent='Offline-Installation benötigt die HTTPS-Webadresse. Lokale Datei ist nur ein Testmodus.';}

if(typeof navigator!=='undefined'&&navigator.storage&&navigator.storage.persist){navigator.storage.persisted().then(p=>p||navigator.storage.persist()).catch(()=>{});}
if(typeof document!=='undefined'&&document.addEventListener)document.addEventListener('keydown',ev=>{if(ev.key!=='Enter'||ev.repeat||!session||!session.done||/^(TEXTAREA|INPUT|SELECT)$/.test(ev.target.tagName))return;const n=$('#next');if(n&&!n.hidden&&document.activeElement!==n){ev.preventDefault();n.click();}});
render();
</script></html>
