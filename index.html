<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noahs Englisch</title><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#175b4e"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" href="./icon.svg"><style>
:root{font-family:system-ui,sans-serif;color:#18302c;background:#f2f5f1;font-size:16px}*{box-sizing:border-box}body{margin:0}header,main,nav{max-width:860px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:26px;margin:4px 0}h2{font-size:22px}h3{font-size:18px}p{line-height:1.55}small,.muted{color:#5c706a}nav{display:flex;gap:8px;overflow:auto;padding-top:0}button,select,input,textarea{font:inherit;border-radius:10px;border:1px solid #b8c9bf;padding:12px}button{cursor:pointer;background:white;color:#18302c}button.active,.primary{background:#175b4e;color:white;border-color:#175b4e}button:disabled{opacity:.45;cursor:default}input,textarea,select{width:100%;background:white;color:#18302c;margin:5px 0 12px}textarea{min-height:90px}label{display:block;font-size:14px;font-weight:600}.card{background:white;border:1px solid #dce5dc;border-radius:18px;padding:22px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.tag{font-size:12px;padding:5px 9px;border-radius:20px;background:#e7eee8;display:inline-block}.notice{background:#fff3d5;border-radius:12px;padding:14px;line-height:1.5}.success{color:#17624d}.error{color:#9c342c}#feedback{line-height:1.7}mark{background:#ffe0b2;border-radius:3px;padding:1px 3px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;border-bottom:1px solid #e3e8e1;padding:10px 5px}.scroll{overflow:auto}.question{font-size:25px;line-height:1.5;margin:25px 0}details{margin:10px 0}summary{cursor:pointer}a{color:#175b4e}footer{font-size:12px;color:#5c706a;padding:20px;text-align:center}[hidden]{display:none!important}@media(max-width:500px){main,header,nav{padding:14px}.card{padding:17px}nav button{font-size:13px;white-space:nowrap;padding:10px}.row{flex-direction:column}.question{font-size:22px}}
</style><header><div><small>ENGLISCH · UNIT 1</small><h1>Noahs Lernbuch</h1></div><span class="tag">Prototyp 0.2</span></header><nav id="nav"></nav><main><div class="notice" id="storage"></div><p id="offline" class="muted">Offline-Vorbereitung läuft …</p><section id="screen"></section><noscript>Bitte diese App in Safari über die Webadresse öffnen. Die Dateivorschau führt die App nicht aus.</noscript></main><footer>Ohne Konto · ohne Tracking · keine externen Bibliotheken · keine KI-API</footer>
<script>
'use strict';
const seed=[];
const KEY='noah-english-v01';let db,unlocked=false,tab='Lernen',session=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fresh(){return {version:1,pin:'',entries:seed.map(v=>({id:v.id,approved:null,pending:v,progress:{}}))};}
let storageOK=true;try{const raw=localStorage.getItem(KEY);db=raw?validate(JSON.parse(raw)):fresh();localStorage.setItem(KEY,JSON.stringify(db));}catch(e){db=fresh();storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true;}catch(e){storageOK=false;}storageMessage();}
function storageMessage(){$('#storage').textContent=storageOK?'Deine Daten bleiben auf diesem Gerät. Regelmäßig eine Sicherung exportieren. iPhone: In Safari über Teilen → Zum Home-Bildschirm hinzufügen.':'Speicherung nicht verfügbar oder gespeicherte Daten nicht lesbar. Diese Sitzung ist nur temporär. Bitte eine Sicherung exportieren; bestehende Daten werden nicht automatisch übernommen.';}
function validate(x){if(!x||x.version!==1||!Array.isArray(x.entries)||x.entries.length>5000||typeof x.pin!=='string'||(x.pin&&!/^\d{4,8}$/.test(x.pin)))throw Error('Ungültiges Sicherungsformat');const ids=new Set();for(const e of x.entries){if(!e||(!e.approved&&!e.pending)||typeof e.id!=='string'||ids.has(e.id)||!e.progress||typeof e.progress!=='object')throw Error('Ungültiger Eintrag');ids.add(e.id);for(const k of ['approved','pending']){const v=e[k];if(v!==null){if(!v||['en','de','unit','section','page','sentence','translation','note','also'].some(f=>typeof v[f]!=='string'||v[f].length>10000))throw Error('Ungültige Vokabel');}}for(const p of Object.values(e.progress)){if(!p||!Number.isFinite(p.attempts)||!Number.isFinite(p.due)||!Array.isArray(p.days)||p.days.some(d=>typeof d!=='string')||typeof p.source!=='string'||typeof p.lastOK!=='boolean')throw Error('Ungültiger Lernstand');}}return x;}
function render(){if(tab!=='Eltern')unlocked=false;$('#nav').innerHTML=['Lernen','Lernstand','Vokabelbuch','Eltern'].map(t=>`<button class="${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;session=null;render();});storageMessage();({Lernen:home,Lernstand:progress,Vokabelbuch:book,Eltern:parents})[tab]();}
function home(){const n=db.entries.filter(e=>e.approved).length;$('#screen').innerHTML=`<h2>Eine kleine Runde Englisch</h2><p class="muted">${n} freigegebene Einträge · ${db.entries.filter(e=>e.pending).length} warten auf Prüfung</p><div class="card"><label for="mode">Was möchtest du üben?</label><select id="mode"><option value="sentence">Buchsätze übersetzen</option><option value="word">Vokabeln abrufen</option><option value="spell">Englisch buchstabieren</option></select><label for="section">Abschnitt</label><select id="section"><option value="">Alle Abschnitte</option>${[...new Set(db.entries.map(e=>(e.approved||e.pending).section))].map(s=>`<option>${esc(s)}</option>`).join('')}</select><p>Bis zu acht Aufgaben. Fällige und bisher ungeübte Inhalte zuerst. Fehler kommen am Ende noch einmal dran.</p><button class="primary" id="start">Lernrunde starten</button></div>${!n?'<p>Im Elternbereich zuerst die Vokabeldatei importieren und Einträge freigeben.</p>':''}`;$('#start').onclick=start;}
function start(){let mode=$('#mode').value,section=$('#section').value;const all=db.entries.filter(e=>e.approved&&(!section||e.approved.section===section)&& (mode!=='sentence'||(e.approved.sentence&&e.approved.translation)));if(!all.length){alert('Für diese Auswahl sind noch keine passenden Einträge freigegeben.');return;}all.sort((a,b)=>(a.progress[mode]?.due||0)-(b.progress[mode]?.due||0));session={mode,queue:all.slice(0,8).map(e=>e.id),index:0,done:false,results:[],retried:new Set(),revealed:false};question();}
function current(){return db.entries.find(e=>e.id===session.queue[session.index]);}
function question(){if(session.index>=session.queue.length){$('#screen').innerHTML=`<div class="card"><h2>Runde abgeschlossen</h2><p>${session.results.filter(r=>r.ok).length} von ${session.results.length} Versuchen richtig.</p><p>Verbesserte Antworten werden getrennt von einem ersten richtigen Versuch erfasst. „Sicher“ braucht Erfolge an drei verschiedenen Tagen.</p><button id="back">Zur Übersicht</button></div>`;$('#back').onclick=home;return;}let e=current(),v=e.approved,m=session.mode;session.done=false;session.revealed=false;$('#screen').innerHTML=`<span class="tag">${session.index+1} / ${session.queue.length} · ${esc(v.section)}</span><div class="card"><small>${m==='sentence'?'Übersetze wie im Buch':m==='word'?'Wie heißt das auf Englisch?':'Buchstabiere mit englischen Buchstabennamen'}</small><p class="question">${esc(m==='sentence'?v.translation:m==='word'?v.de:v.en)}</p><button id="promptAudio">Aufgabe anhören</button>${m!=='spell'?'<label for="answer" style="margin-top:20px">Deine englische Antwort</label><textarea id="answer" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea><button class="primary" id="check">Text prüfen</button>':''}<button id="reveal">${m==='spell'?'Gesprochen – Lösung vergleichen':'Laut beantwortet / Lösung zeigen'}</button><div id="feedback" aria-live="polite"></div><button id="next" hidden>Weiter</button></div><p class="muted">Texte werden mit Groß- und Kleinschreibung geprüft. Mündliche Antworten bewertest du selbst. Keine Mikrofonerkennung in Version 0.1.</p>`;$('#promptAudio').onclick=()=>speak(m==='spell'?v.en:m==='sentence'?v.translation:v.de,m==='spell'?'en-GB':'de-DE');if($('#check'))$('#check').onclick=check;$('#reveal').onclick=reveal;$('#next').onclick=()=>{session.index++;question();};}
function norm(s){return s.normalize('NFC').replace(/[‘’]/g,"'").replace(/\s+/g,' ').trim().replace(/[.!?]+$/,'');}
function target(){const v=current().approved;return session.mode==='sentence'?v.sentence:v.en;}
function difference(a,b){const aa=norm(a).split(' '),bb=norm(b).split(' ');let d=Array.from({length:aa.length+1},()=>Array(bb.length+1).fill(0));for(let i=aa.length;i>=0;i--)for(let j=bb.length;j>=0;j--){if(i===aa.length)d[i][j]=bb.length-j;else if(j===bb.length)d[i][j]=aa.length-i;else d[i][j]=aa[i]===bb[j]?d[i+1][j+1]:1+Math.min(d[i+1][j],d[i][j+1],d[i+1][j+1]);}let i=0,j=0,out=[];while(i<aa.length||j<bb.length){if(i<aa.length&&j<bb.length&&aa[i]===bb[j]){out.push(esc(bb[j]));i++;j++;}else if(i<aa.length&&j<bb.length&&d[i][j]===1+d[i+1][j+1]){out.push(`<mark>${esc(aa[i])} → ${esc(bb[j])}</mark>`);i++;j++;}else if(j<bb.length&&d[i][j]===1+d[i][j+1]){out.push(`<mark>+ ${esc(bb[j++])}</mark>`);}else{out.push(`<mark>− ${esc(aa[i++])}</mark>`);}}return out.join(' ');}
function check(){if(session.done)return;const a=$('#answer').value;if(!a.trim())return;const ok=norm(a)===norm(target());record(ok,'Textvergleich');$('#feedback').innerHTML=`<h3 class="${ok?'success':'error'}">${ok?'Genau richtig.':'Noch nicht wie im Buch.'}</h3>${ok?'':`<p>${difference(a,target())}</p>`}<p><b>Buchlösung:</b> ${esc(target())}</p><button id="audio">Lösung anhören</button>`;$('#audio').onclick=()=>speak(target(),'en-GB');}
function reveal(){if(session.done)return;session.revealed=true;$('#reveal').disabled=true;if($('#check'))$('#check').disabled=true;const t=target(),m=session.mode;$('#feedback').innerHTML=`<p><b>Lösung:</b> ${esc(m==='spell'?t.split('').join(' · '):t)}</p><button id="audio">${m==='spell'?'Buchstaben anhören':'Lösung anhören'}</button><p>War deine laut gesprochene Antwort vor dem Aufdecken richtig?</p><button id="yes">Ja, richtig</button> <button id="no">Noch üben</button>`;$('#audio').onclick=()=>speak(m==='spell'?t.replace(/[^a-z]/gi,'').split('').join(', '):t,'en-GB');$('#yes').onclick=()=>finishSelf(true);$('#no').onclick=()=>finishSelf(false);}
function finishSelf(ok){record(ok,'Selbstbewertung');$('#feedback').innerHTML+=`<p>${ok?'Als richtig erfasst.':'Kommt zur Wiederholung wieder.'} Selbstbewertung gespeichert.</p>`;$('#yes').disabled=$('#no').disabled=true;}
function record(ok,source){if(session.done)return;session.done=true;const e=current(),m=session.mode,now=Date.now(),day=new Date().toLocaleDateString('en-CA');let p=e.progress[m]||{attempts:0,days:[],due:0,source,lastOK:false};p.attempts++;p.lastOK=ok;p.source=source;const repeated=session.retried.has(e.id);if(ok&&!repeated&&!p.days.includes(day))p.days.push(day);if(!ok)p.days=[];p.due=now+(ok?(repeated?1:Math.min(14,[1,3,7,14][Math.min(p.days.length-1,3)]||1))*86400000:0);e.progress[m]=p;session.results.push({id:e.id,ok,source});if(!ok&&!repeated){session.retried.add(e.id);session.queue.push(e.id);}save();$('#next').hidden=false;$('#reveal').disabled=true;if($('#check'))$('#check').disabled=true;}
function speak(text,lang){if(!('speechSynthesis'in window)){alert('Vorlesen ist hier nicht verfügbar.');return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.85;u.onerror=()=>alert('Vorlesen fehlgeschlagen. Bitte auf dem iPhone die Systemstimmen prüfen.');speechSynthesis.speak(u);}
function status(p){return !p?'Noch offen':!p.lastOK?'Noch üben':p.days.length>=3?'Sicher':'Im Aufbau';}
function progress(){$('#screen').innerHTML=`<h2>Dein Lernstand</h2><p>Wort, Satz und Buchstabieren werden einzeln betrachtet. Drei erfolgreiche Lerntage ergeben „Sicher“.</p><div class="card scroll"><table><thead><tr><th>Eintrag</th><th>Wort</th><th>Satz</th><th>Buchstabieren</th></tr></thead><tbody>${db.entries.filter(e=>e.approved).map(e=>`<tr><td>${esc(e.approved.en)}</td>${['word','sentence','spell'].map(m=>`<td>${m==='sentence'&&!e.approved.sentence?'Kein Buchsatz':status(e.progress[m])}${e.progress[m]?`<br><small>${esc(e.progress[m].source)}</small>`:''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function book(){$('#screen').innerHTML=`<h2>Vokabelbuch</h2><button class="primary" id="add">Neuen Eintrag erfassen</button><input id="search" aria-label="Vokabeln durchsuchen" placeholder="Wort, Abschnitt oder Seite suchen"><div id="list"></div>`;$('#add').onclick=()=>edit(null,false);$('#search').oninput=list;list();}
function list(){const q=$('#search').value.toLowerCase();$('#list').innerHTML=db.entries.filter(e=>JSON.stringify(e.approved||e.pending).toLowerCase().includes(q)).map(e=>{const v=e.approved||e.pending;return `<div class="card"><span class="tag">${e.pending?'Prüfung offen':'Freigegeben'}</span><small> ${esc(v.section)} · S. ${esc(v.page)}</small><h3>${esc(v.en)} <span class="muted">· ${esc(v.de)}</span></h3>${v.sentence?`<p>${esc(v.sentence)}<br><small>${esc(v.translation)}</small></p>`:''}${v.note?`<p>${esc(v.note)}</p>`:''}${v.also?`<small>Auch: ${esc(v.also)}</small><br>`:''}<button data-edit="${esc(e.id)}">Bearbeiten</button>${e.pending&&e.approved?'<p class="muted">Änderung wartet auf Prüfung; angezeigt wird die freigegebene Fassung.</p>':''}</div>`;}).join('');$('#list').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit,false));}
function edit(id,parent){const e=db.entries.find(e=>e.id===id),v=e?(e.pending||e.approved):{unit:'Unit 1',section:'',page:'',en:'',de:'',sentence:'',translation:'',note:'',also:''};const fields={unit:'Unit',section:'Abschnitt',page:'Buchseite',en:'Englisch',de:'Deutsch (mehrere Bedeutungen mit Semikolon)',sentence:'Englischer Originalsatz',translation:'Deutsche Satzübersetzung',note:'Buchhinweis',also:'Weitere Zuordnung'};$('#screen').innerHTML=`<h2>${parent?'Eintrag prüfen':'Eintrag erfassen'}</h2><p>Nur vorhandene Buchsätze übernehmen. Deutsche Satzübersetzung gegenprüfen.</p><form class="card" id="editor">${Object.entries(fields).map(([k,l])=>`<label for="f-${k}">${l}</label><textarea id="f-${k}" name="${k}" ${['unit','section','en','de'].includes(k)?'required':''}>${esc(v[k])}</textarea>`).join('')}<button class="primary">${parent?'Korrigieren und freigeben':'Zur Prüfung abgeben'}</button> <button type="button" id="cancel">Zurück</button></form>`;$('#cancel').onclick=render;$('#editor').onsubmit=ev=>{ev.preventDefault();const data=Object.fromEntries(new FormData(ev.target));for(const k in data)data[k]=data[k].trim();if(!!data.sentence!==!!data.translation){alert('Bitte beide Satzfelder ausfüllen oder beide leer lassen.');return;}let entry=e||{id:'own-'+Date.now()+'-'+Math.random().toString(36).slice(2),approved:null,pending:null,progress:{}};data.id=entry.id;if(parent&&unlocked){if(JSON.stringify(entry.approved)!==JSON.stringify(data))entry.progress={};entry.approved=data;entry.pending=null;}else entry.pending=data;if(!e)db.entries.push(entry);save();render();};}
function parents(){if(!unlocked){$('#screen').innerHTML=`<h2>Elternbereich</h2><div class="card"><p>${db.pin?'PIN eingeben.':'Bitte eine Eltern-PIN mit 4–8 Ziffern festlegen.'} Sie ist eine einfache Bedienungssperre auf diesem Gerät.</p><form id="pinForm"><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" required aria-label="Eltern-PIN"><button class="primary">${db.pin?'Öffnen':'PIN festlegen'}</button></form><p class="muted">Die PIN ist kein sicherer Kontoschutz. Sicherungen enthalten die PIN und alle Lerndaten.</p></div>`;$('#pinForm').onsubmit=ev=>{ev.preventDefault();const p=$('#pin').value;if(db.pin&&p!==db.pin){alert('PIN stimmt nicht.');return;}if(!db.pin){db.pin=p;save();}unlocked=true;parents();};return;}
$('#screen').innerHTML=`<h2>Prüfung & Sicherung</h2><p>${db.entries.filter(e=>e.pending).length} Einträge warten auf Freigabe. Englische Buchsätze und ergänzte deutsche Übersetzungen bitte einzeln prüfen. Lautschrift ist in diesem Prototyp noch nicht übertragen.</p><div class="card"><label>Vokabeldatei importieren (ergänzt nur neue Einträge)<input id="vocabImport" type="file" accept="application/json,.json"></label><button id="export">Sicherung exportieren</button><label style="margin-top:15px">Sicherung wiederherstellen (ersetzt den aktuellen Stand)<input id="import" type="file" accept="application/json,.json"></label><button id="lock">Elternbereich sperren</button></div>${db.entries.filter(e=>e.pending).map(e=>`<div class="card"><small>${esc(e.pending.section)} · S. ${esc(e.pending.page)}</small><h3>${esc(e.pending.en)}</h3><p>${esc(e.pending.de)}</p><p>${esc(e.pending.sentence)}<br>${esc(e.pending.translation)}</p><button data-review="${esc(e.id)}">Prüfen / korrigieren / freigeben</button></div>`).join('')}`;$('#vocabImport').onchange=importVocab;$('#export').onclick=backup;$('#import').onchange=restore;$('#lock').onclick=()=>{unlocked=false;parents();};$('#screen').querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>edit(b.dataset.review,true));}
function backup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Noah-Englisch-Sicherung-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);}
async function restore(ev){const f=ev.target.files[0];if(!f)return;try{if(f.size>10*1024*1024)throw Error('Datei zu groß');const next=validate(JSON.parse(await f.text()));if(!confirm('Aktuelle Einträge und Lernstände vollständig durch diese Sicherung ersetzen? Vorher gegebenenfalls exportieren.'))return;db=next;session=null;unlocked=false;save();render();}catch(e){alert('Sicherung nicht eingelesen: '+e.message);}}

function vocabularyPack(x){
 if(!x||x.type!=='noah-vocabulary'||x.version!==1||!Array.isArray(x.entries)||x.entries.length>5000)throw Error('Keine passende Vokabeldatei');
 const entries=x.entries.map(v=>({id:v.id,approved:null,pending:v,progress:{}}));
 validate({version:1,pin:'',entries});
 return entries;
}
async function importVocab(ev){
 const f=ev.target.files[0];if(!f)return;
 try{if(f.size>10*1024*1024)throw Error('Datei zu groß');
 const entries=vocabularyPack(JSON.parse(await f.text()));
 const known=new Set(db.entries.map(e=>e.id));const added=entries.filter(e=>!known.has(e.id));
 if(db.entries.length+added.length>5000)throw Error('Zu viele Einträge');
 db.entries.push(...added);save();parents();alert(added.length+' neue Einträge zur Prüfung aufgenommen. '+(entries.length-added.length)+' vorhandene Einträge unverändert.');
 }catch(e){alert('Import nicht ausgeführt: '+e.message);}
}
if(typeof navigator!=='undefined'&&'serviceWorker' in navigator&&location.protocol==='https:'){
 navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{
 $('#offline').textContent='App für Offline-Nutzung gespeichert. Vorlesen hängt von den verfügbaren Systemstimmen ab.';
 }).catch(()=>{$('#offline').textContent='Offline-Speicherung fehlgeschlagen. Bitte online erneut öffnen.';});
}else if(typeof navigator!=='undefined'){$('#offline').textContent='Offline-Installation benötigt die HTTPS-Webadresse. Lokale Datei ist nur ein Testmodus.';}

render();
</script></html>
